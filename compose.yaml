name: collage

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collage}
      POSTGRES_USER: ${POSTGRES_USER:-collage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collage_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://collage:collage_local_only@postgres:5432/collage}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://collage:collage_local_only@postgres:5432/collage}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "4000:4000"
    stop_grace_period: 20s

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      BOT_PORT: 4001
      INTERNAL_API_URL: http://api:4000
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "4001:4001"
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://collage:collage_local_only@postgres:5432/collage}
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: 4002
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "4002:4002"
    stop_grace_period: 30s

  mini-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.mini-app
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "3000:3000"
    stop_grace_period: 20s

volumes:
  postgres-data:
  redis-data:
