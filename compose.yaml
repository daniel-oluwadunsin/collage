name: collage

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collage}
      POSTGRES_USER: ${POSTGRES_USER:-collage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collage}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://collage:collage@postgres:5432/collage}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.example.ng}
      MINI_APP_PUBLIC_URL: ${MINI_APP_PUBLIC_URL:-https://app.example.ng}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.ng}
      API_SESSION_SECRET: ${API_SESSION_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://collage:collage@postgres:5432/collage}
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MINI_APP_SHORT_NAME: ${TELEGRAM_MINI_APP_SHORT_NAME:-}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-3600}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_TIMEOUT_MS: ${GROQ_TIMEOUT_MS:-8000}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-low}
      GROQ_MAX_TOOL_CALLS: ${GROQ_MAX_TOOL_CALLS:-1}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_MAX_MESSAGE_LENGTH: ${ASSISTANT_MAX_MESSAGE_LENGTH:-1000}
      ASSISTANT_USER_RATE_LIMIT_PER_MINUTE: ${ASSISTANT_USER_RATE_LIMIT_PER_MINUTE:-5}
      ASSISTANT_CHAT_RATE_LIMIT_PER_MINUTE: ${ASSISTANT_CHAT_RATE_LIMIT_PER_MINUTE:-20}
      APP_ENCRYPTION_KEY_ID: ${APP_ENCRYPTION_KEY_ID:-}
      APP_ENCRYPTION_KEY_BASE64: ${APP_ENCRYPTION_KEY_BASE64:-}
      APP_HASH_PEPPER: ${APP_HASH_PEPPER:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LAUNCH_TOKEN_HASH_SECRET: ${LAUNCH_TOKEN_HASH_SECRET:-}
      PROVIDER_CALLS_ENABLED: ${PROVIDER_CALLS_ENABLED:-false}
      MONNIFY_ENV: ${MONNIFY_ENV:-sandbox}
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL:-https://sandbox.monnify.com}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE:-}
      MONNIFY_DISBURSEMENT_WALLET_ACCOUNT_NUMBER: ${MONNIFY_DISBURSEMENT_WALLET_ACCOUNT_NUMBER:-}
      MONNIFY_WEBHOOK_ALLOWED_IPS: ${MONNIFY_WEBHOOK_ALLOWED_IPS:-35.242.133.146}
      MONNIFY_ALLOW_UNSIGNED_SANDBOX_WEBHOOKS: ${MONNIFY_ALLOW_UNSIGNED_SANDBOX_WEBHOOKS:-false}
      OTP_PROVIDER: ${OTP_PROVIDER:-unconfigured}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      SMSGATE_API_BASE_URL: ${SMSGATE_API_BASE_URL:-https://api.sms-gate.app/3rdparty/v1}
      SMSGATE_DEPLOYMENT_MODE: ${SMSGATE_DEPLOYMENT_MODE:-cloud}
      SMSGATE_AUTH_MODE: ${SMSGATE_AUTH_MODE:-jwt}
      SMSGATE_ALLOW_PUBLIC_CLOUD_IN_PRODUCTION: ${SMSGATE_ALLOW_PUBLIC_CLOUD_IN_PRODUCTION:-false}
      SMSGATE_USERNAME: ${SMSGATE_USERNAME:-}
      SMSGATE_PASSWORD: ${SMSGATE_PASSWORD:-}
      SMSGATE_DEVICE_ID: ${SMSGATE_DEVICE_ID:-}
      SMSGATE_SIM_NUMBER: ${SMSGATE_SIM_NUMBER:-1}
      SMSGATE_PRIORITY: ${SMSGATE_PRIORITY:-100}
      SMSGATE_REQUEST_TIMEOUT_MS: ${SMSGATE_REQUEST_TIMEOUT_MS:-10000}
      SMSGATE_TOKEN_TTL_SECONDS: ${SMSGATE_TOKEN_TTL_SECONDS:-3600}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "4000:4000"
    stop_grace_period: 20s

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOT_PORT: 4001
      INTERNAL_API_URL: http://api:4000
      REDIS_URL: redis://redis:6379
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      PROVIDER_CALLS_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MINI_APP_SHORT_NAME: ${TELEGRAM_MINI_APP_SHORT_NAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_PUBLIC_URL: ${TELEGRAM_WEBHOOK_PUBLIC_URL:-https://bot.example.ng/telegram/webhook}
      BOT_INTERNAL_REQUEST_TIMEOUT_MS: ${BOT_INTERNAL_REQUEST_TIMEOUT_MS:-5000}
      TELEGRAM_NOTIFICATION_CONCURRENCY: ${TELEGRAM_NOTIFICATION_CONCURRENCY:-10}
      TELEGRAM_RATE_LIMIT_MAX_RETRIES: ${TELEGRAM_RATE_LIMIT_MAX_RETRIES:-2}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "4001:4001"
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql://collage:collage@postgres:5432/collage}
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: 4002
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.example.ng}
      MINI_APP_PUBLIC_URL: ${MINI_APP_PUBLIC_URL:-https://app.example.ng}
      APP_ENCRYPTION_KEY_ID: ${APP_ENCRYPTION_KEY_ID:-}
      APP_ENCRYPTION_KEY_BASE64: ${APP_ENCRYPTION_KEY_BASE64:-}
      APP_HASH_PEPPER: ${APP_HASH_PEPPER:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LAUNCH_TOKEN_HASH_SECRET: ${LAUNCH_TOKEN_HASH_SECRET:-}
      PROVIDER_CALLS_ENABLED: ${PROVIDER_CALLS_ENABLED:-false}
      MONNIFY_ENV: ${MONNIFY_ENV:-sandbox}
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL:-https://sandbox.monnify.com}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE:-}
      MONNIFY_DISBURSEMENT_WALLET_ACCOUNT_NUMBER: ${MONNIFY_DISBURSEMENT_WALLET_ACCOUNT_NUMBER:-}
      WORKER_MAX_AUTOMATIC_CHARGE_ATTEMPTS: ${WORKER_MAX_AUTOMATIC_CHARGE_ATTEMPTS:-3}
      WORKER_PENDING_POLL_SECONDS: ${WORKER_PENDING_POLL_SECONDS:-60}
      WORKER_STALE_OPERATION_MINUTES: ${WORKER_STALE_OPERATION_MINUTES:-15}
      WORKER_OUTBOX_CONCURRENCY: ${WORKER_OUTBOX_CONCURRENCY:-1}
      WORKER_LIFECYCLE_CONCURRENCY: ${WORKER_LIFECYCLE_CONCURRENCY:-4}
      WORKER_PAYMENT_CONCURRENCY: ${WORKER_PAYMENT_CONCURRENCY:-10}
      WORKER_PAYOUT_CONCURRENCY: ${WORKER_PAYOUT_CONCURRENCY:-2}
      WORKER_REMINDER_CONCURRENCY: ${WORKER_REMINDER_CONCURRENCY:-2}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "4002:4002"
    stop_grace_period: 30s

  mini-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.mini-app
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.ng/v1}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_TELEGRAM_MINI_APP_SHORT_NAME: ${NEXT_PUBLIC_TELEGRAM_MINI_APP_SHORT_NAME:-}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "3000:3000"
    stop_grace_period: 20s

volumes:
  postgres-data:
  redis-data:
