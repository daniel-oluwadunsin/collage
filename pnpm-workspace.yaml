packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true

catalog:
  "@types/express": "5.0.3"
  "@types/node": "24.10.1"
  "eslint": "9.39.1"
  "typescript": "5.9.3"
  "zod": "4.4.3"

minimumReleaseAgeExclude:
  - bullmq@5.80.8
  - grammy@1.45.1
  - lucide-react@1.25.0
  - react-hook-form@7.82.0

overrides:
  "@telegram-apps/bridge>valibot": "1.2.0"
  "@telegram-apps/sdk>valibot": "1.2.0"
  "@telegram-apps/transformers>valibot": "1.2.0"
  "@hono/node-server@1.19.11": "1.19.13"
  "brace-expansion@1.1.12": "1.1.13"
  "flatted@3.3.3": "3.4.2"
  "minimatch@3.1.2": "3.1.5"
  "picomatch@2.3.1": "2.3.2"
  "picomatch@4.0.3": "4.0.4"
  "postcss@8.4.31": "8.5.19"
