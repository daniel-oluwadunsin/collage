services:
  - type: web
    name: collage-apiconf
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_PORT
        value: 4000
      - key: BOT_PORT
        value: 4001
      - key: WORKER_HEALTH_PORT
        value: 4002
      - key: PUBLIC_APP_URL
        value: https://collage-apiconf.onrender.com
      - key: API_PUBLIC_URL
        value: https://collage-apiconf.onrender.com/api
      - key: MINI_APP_PUBLIC_URL
        value: https://collage-apiconf.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://collage-apiconf.onrender.com
      - key: INTERNAL_API_URL
        value: http://127.0.0.1:4000
      - key: API_INTERNAL_URL
        value: http://127.0.0.1:4000
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: NEXT_PUBLIC_APP_ENV
        value: demo
      - key: TELEGRAM_WEBHOOK_PUBLIC_URL
        value: https://collage-apiconf.onrender.com/telegram/webhook
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: 3600
      - key: BOT_INTERNAL_REQUEST_TIMEOUT_MS
        value: 5000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_MS
        value: 8000
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: GROQ_MAX_TOOL_CALLS
        value: 1
      - key: ASSISTANT_ENABLED
        value: "false"
      - key: ASSISTANT_MAX_MESSAGE_LENGTH
        value: 1000
      - key: ASSISTANT_USER_RATE_LIMIT_PER_MINUTE
        value: 5
      - key: ASSISTANT_CHAT_RATE_LIMIT_PER_MINUTE
        value: 20
      - key: TELEGRAM_NOTIFICATION_CONCURRENCY
        value: 4
      - key: TELEGRAM_RATE_LIMIT_MAX_RETRIES
